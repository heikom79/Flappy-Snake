name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: System-Abhängigkeiten installieren
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y \
            build-essential ccache git libncurses5:i386 libstdc++6:i386 \
            zlib1g-dev libssl-dev libffi-dev unzip openjdk-17-jdk python3-pip \
            autoconf libtool pkg-config wget

      - name: Buildozer und Cython installieren
        run: |
          pip install --upgrade pip
          pip install --upgrade cython==0.29.36 buildozer

      - name: Android SDK Lizenzen hinterlegen & Erstversuch
        continue-on-error: true
        run: |
          mkdir -p /home/runner/.buildozer/android/platform/android-sdk/licenses
          echo "8933bad161af4178b1185d1a37fbf41ea5269c55" > /home/runner/.buildozer/android/platform/android-sdk/licenses/android-sdk-license
          echo "84831b9409646a918e30573bab4c9c91346d8abd" > /home/runner/.buildozer/android/platform/android-sdk/licenses/android-sdk-preview-license
          buildozer -v android debug

      - name: SDK-Pfad für Buildozer via Python reparieren
        run: |
          python3 -c '
          import os, glob
          sdk = "/home/runner/.buildozer/android/platform/android-sdk"
          tools_dir = os.path.join(sdk, "tools")
          os.makedirs(tools_dir, exist_ok=True)
          
          # Finde den korrekten bin-Ordner der Command-Line-Tools
          cmd_bins = glob.glob(os.path.join(sdk, "cmdline-tools", "*", "bin")) + glob.glob(os.path.join(sdk, "cmdline-tools", "bin"))
          if cmd_bins:
              src = cmd_bins[0]
              dst = os.path.join(tools_dir, "bin")
              if os.path.lexists(dst):
                  os.remove(dst)
              os.symlink(src, dst)
              print("Symlink erfolgreich erstellt:", src, "->", dst)
          else:
              print("Warnung: Keine cmdline-tools gefunden, fahre fort...")
          '

      - name: Android APK mit Buildozer fertigbauen
        run: |
          buildozer -v android debug

      - name: APK-Datei als Artefakt hochladen
        uses: actions/upload-artifact@v4
        with:
          name: flappy-snake-apk
          path: bin/*.apk
          
