name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: System-Abhängigkeiten installieren
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y \
            build-essential ccache git libncurses5:i386 libstdc++6:i386 \
            zlib1g-dev libssl-dev libffi-dev unzip openjdk-17-jdk python3-pip \
            autoconf libtool pkg-config

      - name: Buildozer und Cython installieren
        run: |
          pip install --upgrade pip
          pip install --upgrade cython==0.29.36 buildozer

      - name: Android APK mit Buildozer bauen
        run: |
          buildozer -v android debug

      - name: APK-Datei als Artefakt hochladen
        uses: actions/upload-artifact@v4
        with:
          name: flappy-snake-apk
          path: bin/*.apk
          
