name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: System-Abhängigkeiten installieren
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y \
            build-essential ccache git libncurses5:i386 libstdc++6:i386 \
            zlib1g-dev libssl-dev libffi-dev unzip openjdk-17-jdk python3-pip \
            autoconf libtool pkg-config wget

      - name: Buildozer und Cython installieren
        run: |
          pip install --upgrade pip
          pip install --upgrade cython==0.29.36 buildozer

      - name: Android SDK & Legacy-Symlink vorab einrichten
        run: |
          python3 -c '
          import os, urllib.request, zipfile, shutil

          sdk_dir = "/home/runner/.buildozer/android/platform/android-sdk"
          latest_dir = os.path.join(sdk_dir, "cmdline-tools", "latest")
          tools_dir = os.path.join(sdk_dir, "tools")
          licenses_dir = os.path.join(sdk_dir, "licenses")

          os.makedirs(latest_dir, exist_ok=True)
          os.makedirs(licenses_dir, exist_ok=True)

          # Android-Lizenzen hinterlegen, damit keine Abfrage erfolgt
          with open(os.path.join(licenses_dir, "android-sdk-license"), "w") as f:
              f.write("8933bad161af4178b1185d1a37fbf41ea5269c55")
          with open(os.path.join(licenses_dir, "android-sdk-preview-license"), "w") as f:
              f.write("84831b9409646a918e30573bab4c9c91346d8abd")

          zip_path = "/tmp/cmdtools.zip"
          extract_path = "/tmp/cmdtools_ext"

          print("Lade Android Command-Line-Tools herunter...")
          url = "https://dl.google.com/android/repository/commandlinetools-linux-6514223_latest.zip"
          urllib.request.urlretrieve(url, zip_path)

          print("Entpacke Tools...")
          with zipfile.ZipFile(zip_path, "r") as zip_ref:
              zip_ref.extractall(extract_path)

          # Inhalt korrekt in cmdline-tools/latest/ kopieren
          src_cmdline = os.path.join(extract_path, "cmdline-tools")
          if os.path.exists(src_cmdline):
              for item in os.listdir(src_cmdline):
                  s = os.path.join(src_cmdline, item)
                  d = os.path.join(latest_dir, item)
                  if os.path.isdir(s):
                      if os.path.exists(d):
                          shutil.rmtree(d)
                      shutil.copytree(s, d)
                  else:
                      shutil.copy2(s, d)

          # Legacy-Symlink erstellen: tools -> cmdline-tools/latest
          # Dadurch findet Buildozer tools/bin/sdkmanager garantiert
          if os.path.lexists(tools_dir):
              os.remove(tools_dir)
          os.symlink(os.path.join(sdk_dir, "cmdline-tools", "latest"), tools_dir)

          # Aufräumen
          shutil.rmtree(extract_path, ignore_errors=True)
          if os.path.exists(zip_path):
              os.remove(zip_path)

          print("Android SDK und Legacy-Verknüpfung erfolgreich eingerichtet.")
          '

      - name: Android APK mit Buildozer bauen
        run: |
          buildozer -v android debug

      - name: APK-Datei als Artefakt hochladen
        uses: actions/upload-artifact@v4
        with:
          name: flappy-snake-apk
          path: bin/*.apk
          
