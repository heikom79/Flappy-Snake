name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: System-Abhängigkeiten installieren
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y \
            build-essential ccache git libncurses5:i386 libstdc++6:i386 \
            zlib1g-dev libssl-dev libffi-dev unzip openjdk-17-jdk python3-pip \
            autoconf libtool pkg-config wget

      - name: Buildozer und Cython installieren
        run: |
          pip install --upgrade pip
          pip install --upgrade cython==0.29.36 buildozer

      - name: Android SDK & Command-Line-Tools vorab einrichten
        run: |
          SDK_DIR="/home/runner/.buildozer/android/platform/android-sdk"
          mkdir -p "$SDK_DIR/cmdline-tools/latest"
          mkdir -p "$SDK_DIR/licenses"
          
          # Android-Lizenzen hinterlegen
          echo "8933bad161af4178b1185d1a37fbf41ea5269c55" > "$SDK_DIR/licenses/android-sdk-license"
          echo "84831b9409646a918e30573bab4c9c91346d8abd" > "$SDK_DIR/licenses/android-sdk-preview-license"

          # Offizielle Command-Line-Tools herunterladen
          echo "Lade Android Command-Line-Tools herunter..."
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-6514223_latest.zip -O /tmp/cmdtools.zip
          mkdir -p /tmp/cmdtools_extracted
          unzip -q /tmp/cmdtools.zip -d /tmp/cmdtools_extracted
          
          # In den 'latest'-Ordner verschieben
          rm -rf "$SDK_DIR/cmdline-tools/latest/*"
          cp -r /tmp/cmdtools_extracted/cmdline-tools/* "$SDK_DIR/cmdline-tools/latest/"
          rm -rf /tmp/cmdtools.zip /tmp/cmdtools_extracted

          # Symlink für den von Buildozer gesuchten legacy-Pfad (tools/bin) erstellen
          mkdir -p "$SDK_DIR/tools"
          ln -sfn "$SDK_DIR/cmdline-tools/latest/bin" "$SDK_DIR/tools/bin"
          ln -sfn "$SDK_DIR/cmdline-tools/latest/lib" "$SDK_DIR/tools/lib"
          
          echo "Android SDK Struktur erfolgreich vorbereitet."

      - name: Android APK mit Buildozer bauen
        run: |
          buildozer -v android debug

      - name: APK-Datei als Artefakt hochladen
        uses: actions/upload-artifact@v4
        with:
          name: flappy-snake-apk
          path: bin/*.apk
          
